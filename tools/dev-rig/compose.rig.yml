# Overlay on docker/dev/docker-compose.yml for the local routing + road-data rig
# (#612). Not meant to be run by hand — tools/dev-rig/up.sh sets RIG_REPO and
# RIG_DATA and runs it under its own project name (detour-rig), so its volumes
# never touch a developer's detour-dev stack, and a Belgium graph built there is
# not overwritten by this one's small extract.
#
# Paths are absolute through RIG_REPO/RIG_DATA rather than relative: compose
# resolves an override file's relative paths against the *first* file's
# directory (docker/dev), which reads wrong from here.

services:
  graphhopper:
    volumes:
      # Same targets as services/graphhopper.yml, so these replace its mounts
      # rather than adding to them. The config is the repo's own dev config with
      # only datareader.file rewritten by up.sh — encoded values and profiles
      # stay whatever docker/dev/config/graphhopper/config.yml says.
      - ${RIG_DATA:?run tools/dev-rig/up.sh}/osm:/osm:ro
      - ${RIG_DATA}/graphhopper-config.yml:/config.yml:ro
    environment:
      # Luxembourg with both CH profiles peaks at ~1.3 GB; up.sh sets RIG_GH_HEAP.
      JAVA_OPTS: -Xmx${RIG_GH_HEAP:-2g} -Xms512m

  # The API, built from this checkout's backend/ — the dev stack deliberately
  # leaves it out (developers run it from an IDE on the same port), but the rig
  # needs one the importers can load into and the emulator can reach.
  api:
    build:
      context: ${RIG_REPO:?run tools/dev-rig/up.sh}/backend
    image: detour-rig-api:local
    restart: unless-stopped
    networks:
      - detour-int
    ports:
      - 127.0.0.1:7500:7500
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The least-privileged role docker/dev's postgres init script creates.
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=detour;Username=detour;Password=detour
      # Keycloak is not part of the rig: spin and in-app navigation are
      # anonymous. The authority still has to be set for the API to boot.
      Idp__Authority: http://localhost:7580/realms/detour
      Idp__RequireHttpsMetadata: "false"
      Cache__RedisConnectionString: ""
      TZ: ${TZ:-Europe/Brussels}
    volumes:
      # Importer JSON, read by `dotnet Detour.Api.dll import-*` via `compose exec`.
      - ${RIG_DATA}/import:/import:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Same probe as docker/prod/docker-compose.yml — see the comment there for
      # why it is bash and printf rather than CMD-SHELL and echo -e.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/7500 && printf 'GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q Healthy <&3",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
