# Version and security updates for every dependency ecosystem in the repo
# (#413). Weekly, with minor and patch bumps grouped into one PR per
# ecosystem so the queue stays reviewable; majors still arrive one PR each,
# since those are the ones that need reading. Security updates are not
# affected by the schedule or the grouping — Dependabot opens them as soon as
# an advisory matches.
#
# None of these paths are under app/src/main or shared/src/*Main, so the
# `version` check does not ask these PRs for a versionName bump.
version: 2
updates:
  - package-ecosystem: gradle
    directories: [/, /tools/mocklocation]
    schedule:
      interval: weekly
    labels: [chore]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # compose-rules 0.5+ is built against detekt 2.0 (alpha); we are on
      # detekt 1.23, and a ruleset built for another detekt major doesn't load
      # (see build.gradle.kts). It moves together with the detekt 2 upgrade.
      - dependency-name: io.nlopez.compose.rules:detekt
        versions: [">= 0.5.0"]
      # 1.12.0 doesn't resolve for the iOS targets yet (#807). Only that
      # version, so the next release is tried again.
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-core
        versions: ["1.12.0"]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    labels: [chore]
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Microsoft.OpenApi is pinned only to patch an advisory in the 2.x that
      # Microsoft.AspNetCore.OpenApi pulls in. 3.x breaks that package's XML
      # comment source generator (#793), so it moves when ASP.NET Core does.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]

  # Also bumps the commit SHAs that build.yml pins third-party actions to,
  # keeping the `# vX.Y.Z` comment beside each in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /.devcontainer]
    schedule:
      interval: weekly
    labels: [chore]

  - package-ecosystem: docker-compose
    directory: /docker/prod
    schedule:
      interval: weekly
    labels: [chore]
