name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # No server URLs or Cloudflare Access credentials are built in. They would
      # end up as plain strings in BuildConfig, readable by anyone who unzips the
      # APK — which outlives this repo's access controls the moment the file is
      # handed to someone. The app takes all four values at runtime, from
      # Settings → Routing server and Settings → Backup sync, or in one step from
      # Settings → Server config file.
      #
      # The keystore is decoded to a file that lives only on this ephemeral
      # runner, never committed or logged. A push to main MUST sign: an
      # unsigned "release" would be published as an APK nobody can install,
      # so a missing secret fails the build loudly here instead of surfacing
      # three steps later as a wrong-filename error. PR builds (which never
      # see repository secrets from forks) are allowed to stay unsigned —
      # they exist to prove the release build compiles and minifies.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is missing or empty — a push to main must produce a signed release. Check repo Settings → Secrets and variables → Actions (Repository secrets, exact name RELEASE_KEYSTORE_B64)."
            exit 1
          fi

      # Names only, never values: an empty companion secret otherwise
      # surfaces five minutes later as keytool's misleading "keystore
      # password was incorrect" with a blank alias in the message.
      #
      # Signing only. The Play service account is checked separately, in the
      # gate below — the APK is the thing this workflow exists to produce, and
      # it must not fail to build because a Play credential is missing.
      - name: Check signing secrets are complete
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secrets:$missing"
            exit 1
          fi

      # Play publishing is off until the Console account is verified and the
      # app has had one bundle uploaded by hand — until then every API upload
      # comes back rejected and takes the whole run, and with it the GitHub
      # release, down with it. Turn it on in one place when Play is ready:
      # Settings → Secrets and variables → Actions → Variables,
      # PUBLISH_TO_PLAY = true. A missing service account keeps it off even
      # when the variable says true, rather than failing the build.
      - name: Decide whether to publish to Play
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ vars.PUBLISH_TO_PLAY }}" != "true" ]; then
            echo "Play upload skipped: repository variable PUBLISH_TO_PLAY is not 'true'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PUBLISH_TO_PLAY is true but the PLAY_SERVICE_ACCOUNT_JSON secret is empty — skipping the Play upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Play refuses any upload whose versionCode isn't higher than every code
      # it has already seen, so a hand-edited number in build.gradle.kts is one
      # forgotten bump away from a rejected release. The run number only ever
      # increases, which is the single property Play cares about. Doubling it
      # leaves an odd slot for the watch artifact: phone and watch share an
      # applicationId, and Play requires their codes to differ. The +1000 floor
      # clears the codes already published as GitHub-release APKs (66 at the
      # time of writing), so an existing sideloaded install still sees Play's
      # copy as newer.
      - name: Stamp version codes
        if: github.event_name == 'push'
        run: |
          base=$(( 1000 + GITHUB_RUN_NUMBER * 2 ))
          echo "VERSION_CODE=$base" >> "$GITHUB_ENV"
          echo "WEAR_VERSION_CODE=$(( base + 1 ))" >> "$GITHUB_ENV"

      # #7 was one missing line on an OutlinedTextField, and nothing in the
      # toolchain noticed: there is no Robolectric, no compose-ui-test and no
      # androidTest source set here, so a credential field that leaks to the
      # keyboard cache compiles clean and ships. Cheap grep, run before the
      # tests so it fails in seconds.
      - name: Check credential fields use the secure components
        run: .claude/skills/detour-compose-state-hazards/scripts/check-secret-fields.sh

      # app/src/test and shared/ both hold unit tests that had never run in CI:
      # this job only ever assembled, and ios.yml — which does run the shared
      # tests — is path-gated on shared/** and iosApp/**, so a change under app/
      # was tested by nothing at all. Before the assemble step, so a red test
      # fails the build in seconds rather than after a full release build.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest

      # One invocation, so the version codes stamped above are read once and
      # every artifact in this release agrees on them. The watch app is built
      # both ways: .aab for Play, .apk for sideloading off the GitHub release
      # (it used to ride along inside the phone APK — see the note in
      # app/build.gradle.kts for why it no longer does).
      - name: Build release artifacts
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Baked into BuildConfig.UPDATE_REPO, so a fork's build checks the
          # fork's own releases. Blank in every build that is not this one,
          # which is what keeps the update check inert everywhere else.
          UPDATE_REPO: ${{ github.repository }}
        run: |
          ./gradlew :app:assembleGithubRelease :app:bundleRelease \
                    :wear:assembleRelease :wear:bundleRelease

      # The APK carries the version in its name, so a downloaded file still says
      # what it is once it's sitting in a Downloads folder next to four others.
      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE:-local}" >> "$GITHUB_OUTPUT"

      # Glob because the artifact name depends on signing: app-release.apk
      # when signed (always, on push — see the decode step), or
      # app-release-unsigned.apk on an unsigned PR build.
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/githubRelease/app-githubRelease*.apk \
             detour-${{ steps.version.outputs.name }}.apk
          cp wear/build/outputs/apk/release/wear-release*.apk \
             detour-wear-${{ steps.version.outputs.name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: detour-apk-${{ steps.version.outputs.name }}
          path: detour-*.apk

      # The bundles were built for the Play upload steps below, which stay off
      # until PUBLISH_TO_PLAY is set — and Play Console takes an .aab, never an
      # .apk, so without this there is nothing in a run to upload by hand. Named
      # with the version code as well as the name: Play rejects a code it has
      # already seen, and the code comes from the run number, not the file.
      - name: Rename bundles
        run: |
          cp app/build/outputs/bundle/release/app-release.aab \
             detour-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab
          cp wear/build/outputs/bundle/release/wear-release.aab \
             detour-wear-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: detour-aab-${{ steps.version.outputs.name }}
          path: detour-*.aab

      # mapping.txt de-obfuscates R8's minified stack traces; published per
      # release so a crash report from an issue can be matched back to source.
      - name: Upload mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: detour-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt

      # Play first, GitHub second: an upload Play rejects (duplicate code, a
      # bundle that fails its checks) should stop the run before a tag and a
      # release exist claiming that version shipped. When the gate above turns
      # it off the step is skipped outright, so the GitHub release still cuts.
      #
      # internal: available to the testers on that list within minutes, no
      # review queue. Promote to production from the Play Console when a build
      # has earned it — nothing here writes to a public track.
      #
      # Phone bundle only. The two bundles used to go up in one release edit,
      # which Play rejected outright:
      #
      #   The APK or bundle with version code 1189 requires the Wear OS system
      #   feature android.hardware.type.watch. To publish this app on the
      #   current track, remove this artifact.
      #
      # `internal` is a phone track and will not hold an artifact declaring
      # <uses-feature android.hardware.type.watch>, no matter that the app has
      # the Wear OS form factor — the form factor is what creates the separate
      # `wear:` tracks the watch bundle belongs on. One rejected watch bundle
      # therefore failed the phone upload too, and with it the tag and the
      # GitHub release. They are two edits now, on their own tracks.
      - name: Publish phone bundle to Play internal track
        if: github.event_name == 'push' && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.maxke24.detour
          # Comma-separated, on one line: this action splits releaseFiles on
          # commas only, so a YAML block scalar hands it one glob with a
          # newline in the middle and it matches nothing.
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      # Tagged per version, so old builds stay downloadable instead of being
      # overwritten. Pushing twice without bumping versionName in
      # app/build.gradle.kts replaces that version's release rather than
      # creating a second one. PRs build the same release artifacts to prove
      # they still compile/minify clean, but a PR has nothing worth tagging and
      # publishing — only a push to main cuts a release.
      # The app reads this to learn which asset belongs to its platform. Not a
      # glob on the release's asset list: detour-wear-<ver>.apk also starts with
      # detour-, so a prefix match hands a phone the watch build. The sha256 is
      # what lets the app refuse a download that did not arrive intact.
      - name: Generate update manifest
        if: github.event_name == 'push'
        run: |
          phone="detour-${{ steps.version.outputs.name }}.apk"
          wear="detour-wear-${{ steps.version.outputs.name }}.apk"
          cat > update.json <<EOF
          {
            "version": "${{ steps.version.outputs.name }}",
            "artifacts": {
              "android-phone": {
                "asset": "$phone",
                "size": $(stat -c%s "$phone"),
                "sha256": "$(sha256sum "$phone" | cut -d' ' -f1)"
              },
              "android-wear": {
                "asset": "$wear",
                "size": $(stat -c%s "$wear"),
                "sha256": "$(sha256sum "$wear" | cut -d' ' -f1)"
              }
            }
          }
          EOF
          cat update.json

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          make_latest: true
          files: |
            detour-${{ steps.version.outputs.name }}.apk
            detour-wear-${{ steps.version.outputs.name }}.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
            update.json
          body: |
            Detour v${{ steps.version.outputs.name }} (versionCode
            ${{ steps.version.outputs.code }}), built from
            ${{ github.sha }}.${{ steps.play.outputs.enabled == 'true' && ' Also published to the Play internal testing track.' || '' }}

            Download the `.apk` below and install it on your phone (allow
            installs from unknown sources). `detour-wear-*.apk` is the watch
            app — sideload it separately with `adb`, or take it from Play once
            you're on the internal testers list.

            This build ships with no server configured. Point it at your own
            under Settings → Routing server and Settings → Backup sync, or
            import a saved config under Settings → Server config file. See
            `backend/README.md` to host one.

      # `wear:internal` — the internal track of the Wear OS form factor, a
      # different track from the `internal` above and the only one that accepts
      # an artifact declaring android.hardware.type.watch. The action validates
      # the name against the tracks Play reports for this app, so a missing or
      # renamed form factor fails here with the list of tracks that do exist
      # rather than a vague rejection.
      #
      # Last, after the GitHub release, on purpose: the phone build is the
      # product, and the watch app is downloadable as a sideloadable APK from
      # the release either way. A watch upload Play turns down still marks the
      # run failed — visible, not swallowed — but by then the APKs are
      # published and the tag stands.
      #
      # No mappingFile: the watch build sets isMinifyEnabled = false
      # (wear/build.gradle.kts), so there is no mapping.txt to send.
      - name: Publish watch bundle to Play wear:internal track
        if: github.event_name == 'push' && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.maxke24.detour
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          track: wear:internal
          status: completed
