name: iOS

# macOS runners are free and unmetered on public repos, so the whole iOS build
# happens here rather than on a Mac. Nothing in this workflow signs anything:
# a simulator build needs no certificate and no Apple Developer account, which
# is what makes a Mac-free loop possible at all. Getting the app onto a real
# iPhone does need a paid account — that is a separate, signed workflow.
on:
  push:
    branches: [main, ios]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 (Xcode 16), not macos-14 (15.4): XcodeGen 2.45 writes project
    # format 77, which 15.4 refuses to open, and its objectVersion option does
    # not override that. Matching the runner to the generator is one line;
    # pinning the generator to an older format is a fight with every upgrade.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # Kotlin/Native downloads a ~1GB toolchain on a cold runner; without this
      # every run pays for it again.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # The one check that is worth running before anything Apple-specific: it
      # type-checks commonMain against the common intersection, so a stray
      # java.* import fails here in seconds instead of during the link.
      - name: Type-check shared common code
        run: ./gradlew :shared:compileCommonMainKotlinMetadata

      # Same commonTest source set, run twice: the JVM pass is seconds and
      # catches a logic regression, the Native pass proves it behaves the same
      # once compiled for the device.
      - name: Run shared tests (JVM)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run shared tests (Kotlin/Native)
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Write Config.xcconfig
        # Secrets are absent on a fork PR. That is fine and deliberate: every
        # endpoint is optional, and the app falls back to the public geocoder
        # and to whatever server the user configures at runtime.
        env:
          DETOUR_ROUTING_URL: ${{ secrets.ROUTING_SERVER_URL }}
          DETOUR_ROUTING_CF_ID: ${{ secrets.ROUTING_CF_ID }}
          DETOUR_ROUTING_CF_SECRET: ${{ secrets.ROUTING_CF_SECRET }}
          DETOUR_API_URL: ${{ secrets.API_URL }}
          DETOUR_IDP_ISSUER: ${{ secrets.IDP_ISSUER }}
          DETOUR_GEOCODER_URL: ${{ secrets.GEOCODER_URL }}
          DETOUR_LIVE_URL: ${{ secrets.LIVE_SERVER_URL }}
        run: |
          cat > iosApp/Config.xcconfig <<EOF
          DETOUR_ROUTING_URL = ${DETOUR_ROUTING_URL}
          DETOUR_ROUTING_CF_ID = ${DETOUR_ROUTING_CF_ID}
          DETOUR_ROUTING_CF_SECRET = ${DETOUR_ROUTING_CF_SECRET}
          DETOUR_API_URL = ${DETOUR_API_URL}
          DETOUR_IDP_ISSUER = ${DETOUR_IDP_ISSUER}
          DETOUR_GEOCODER_URL = ${DETOUR_GEOCODER_URL}
          DETOUR_LIVE_URL = ${DETOUR_LIVE_URL}
          EOF

      # Before xcodegen, so FRAMEWORK_SEARCH_PATHS points at something real
      # by the time xcodebuild links. The in-Xcode preBuild phase does the same
      # thing for a developer pressing Run; CI just does it up front.
      # arm64 only. The runner is Apple silicon, so packForXcode produces the
      # iosSimulatorArm64 slice; a generic simulator destination would
      # otherwise also try to link x86_64 and find nothing.
      - name: Build the shared framework
        run: ./gradlew :shared:packForXcode -Pxcode.sdk=iphonesimulator

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate --spec project.yml
          # xcodegen has exited 0 without writing a project; fail loudly here
          # rather than leaving xcodebuild to report a missing file.
          test -d Detour.xcodeproj || { echo "xcodegen produced no project"; exit 1; }

      # xcodebuild reported "Unable to read project" on a project xcodegen had
      # just written successfully, which is a parse failure rather than a
      # missing file. These print which toolchain is actually selected and
      # whether it can read the project at all, so the next failure names its
      # own cause instead of being inferred from the log.
      - name: Show toolchain and project
        run: |
          xcodebuild -version
          xcode-select -p
          ls -la iosApp/Detour.xcodeproj
          xcodebuild -list -project iosApp/Detour.xcodeproj

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Detour.xcodeproj \
            -scheme Detour \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            | xcbeautify

      # The simulator build, kept. Runnable with `xcrun simctl install` on any
      # Mac, which is what a reviewer wants; useless on a phone.
      - name: Package the simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Detour-simulator.app.zip" Detour.app

      # A real device build, Release, arm64, unsigned.
      #
      # Unsigned is the whole point: signing needs a certificate from a paid
      # Apple Developer account, and nothing in CI has one. The .ipa this
      # produces cannot be installed as-is — it has to be re-signed with your
      # own certificate (Sideloadly, AltStore, or `xcodebuild -exportArchive`
      # on a Mac with your account). That is the one wall $99/yr buys past.
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/Detour.xcodeproj \
            -scheme Detour \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Detour.xcarchive \
            -derivedDataPath build/DerivedDataRelease \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      # An .ipa is a zip with the .app under Payload/ — no export step needed,
      # and -exportArchive would demand the signing identity we deliberately
      # do not have.
      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Detour.xcarchive/Products/Applications/Detour.app build/Payload/
          cd build && zip -qry "$GITHUB_WORKSPACE/Detour-unsigned.ipa" Payload

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: detour-ios
          path: |
            Detour-simulator.app.zip
            Detour-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # A screenshot is the closest thing to "looking at the app" available
      # without a Mac. It boots the simulator, installs the build, gives the
      # map a moment to load a style, and uploads the result as an artifact.
      - name: Screenshot the app
        run: |
          # Whichever iPhone this Xcode ships, rather than a hardcoded model.
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for v in ds.values() for d in v if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/DerivedData -name 'Detour.app' -type d | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          # Pre-grant location so the launch isn't blocked on a permission alert.
          xcrun simctl privacy "$DEVICE" grant location io.github.maxke24.detour || true
          xcrun simctl launch "$DEVICE" io.github.maxke24.detour
          sleep 15
          xcrun simctl io "$DEVICE" screenshot screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: screenshot.png
          if-no-files-found: warn
