name: iOS

# macOS runners are free and unmetered on public repos, so the whole iOS build
# happens here rather than on a Mac. Nothing in this workflow signs anything:
# a simulator build needs no certificate and no Apple Developer account, which
# is what makes a Mac-free loop possible at all. Getting the app onto a real
# iPhone does need a paid account — that is a separate, signed workflow.
on:
  push:
    branches: [ios-port]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # Kotlin/Native downloads a ~1GB toolchain on a cold runner; without this
      # every run pays for it again.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # The one check that is worth running before anything Apple-specific: it
      # type-checks commonMain against the common intersection, so a stray
      # java.* import fails here in seconds instead of during the link.
      - name: Type-check shared common code
        run: ./gradlew :shared:compileCommonMainKotlinMetadata

      # Same commonTest source set, run twice: the JVM pass is seconds and
      # catches a logic regression, the Native pass proves it behaves the same
      # once compiled for the device.
      - name: Run shared tests (JVM)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run shared tests (Kotlin/Native)
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Write Config.xcconfig
        # Secrets are absent on a fork PR. That is fine and deliberate: every
        # endpoint is optional, and the app falls back to the public geocoder
        # and to whatever server the user configures at runtime.
        env:
          DETOUR_ROUTING_URL: ${{ secrets.ROUTING_SERVER_URL }}
          DETOUR_ROUTING_CF_ID: ${{ secrets.ROUTING_CF_ID }}
          DETOUR_ROUTING_CF_SECRET: ${{ secrets.ROUTING_CF_SECRET }}
          DETOUR_SYNC_URL: ${{ secrets.SYNC_SERVER_URL }}
          DETOUR_GEOCODER_URL: ${{ secrets.GEOCODER_URL }}
          DETOUR_LIVE_URL: ${{ secrets.LIVE_SERVER_URL }}
        run: |
          cat > iosApp/Config.xcconfig <<EOF
          DETOUR_ROUTING_URL = ${DETOUR_ROUTING_URL}
          DETOUR_ROUTING_CF_ID = ${DETOUR_ROUTING_CF_ID}
          DETOUR_ROUTING_CF_SECRET = ${DETOUR_ROUTING_CF_SECRET}
          DETOUR_SYNC_URL = ${DETOUR_SYNC_URL}
          DETOUR_GEOCODER_URL = ${DETOUR_GEOCODER_URL}
          DETOUR_LIVE_URL = ${DETOUR_LIVE_URL}
          EOF

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/Detour.xcodeproj \
            -scheme Detour \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # A screenshot is the closest thing to "looking at the app" available
      # without a Mac. It boots the simulator, installs the build, gives the
      # map a moment to load a style, and uploads the result as an artifact.
      - name: Screenshot the app
        run: |
          DEVICE=$(xcrun simctl create detour-shot \
            com.apple.CoreSimulator.SimDeviceType.iPhone-15 \
            com.apple.CoreSimulator.SimRuntime.iOS-17-5 2>/dev/null \
            || xcrun simctl list devices available | grep -m1 -o '[0-9A-F-]\{36\}')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/DerivedData -name 'Detour.app' -type d | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          # Pre-grant location so the launch isn't blocked on a permission alert.
          xcrun simctl privacy "$DEVICE" grant location io.github.maxke24.detour || true
          xcrun simctl launch "$DEVICE" io.github.maxke24.detour
          sleep 15
          xcrun simctl io "$DEVICE" screenshot screenshot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: screenshot.png
          if-no-files-found: warn
