org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
# KMP source sets are laid out by the plugin's own defaults (commonMain,
# androidMain, iosMain); the hierarchy template gives us iosMain for free
# across the three ios targets.
kotlin.mpp.applyDefaultHierarchyTemplate=true
# The ios* targets are declared unconditionally but only buildable on macOS.
# Off macOS they are skipped, which is expected rather than a problem worth
# warning about on every build. Note that :shared:compileCommonMainKotlinMetadata
# still type-checks commonMain against the *common* intersection, so a stray
# java.* import fails on Linux exactly as it would on a Mac.
kotlin.native.ignoreDisabledTargets=true
android.suppressUnsupportedCompileSdk=35
