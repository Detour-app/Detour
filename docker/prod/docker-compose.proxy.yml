# One-hostname layout, as an overlay on the production stack.
#
#   docker compose -f docker/prod/docker-compose.yml \
#                  -f docker/prod/docker-compose.routing.yml \
#                  -f docker/prod/docker-compose.search.yml \
#                  -f docker/prod/docker-compose.proxy.yml up -d
#
# Path-routes a single public hostname to the API, GraphHopper and Photon —
# see nginx/detour.conf.template for why that's possible despite the API and
# Photon both answering under /api. Separate from the base file for the same
# reason docker-compose.cloudflare.yml is: this stack stays proxy-agnostic,
# and this one nginx container is only needed by riders who want the
# single-address Settings field instead of "Different address per service".
#
# Published on the LAN, not loopback: cloudflared lives in a different LXC
# (see docker-compose.lan.yml) and reaches this container across the LAN the
# same way it already reaches the api and keycloak ports.
#
# This overlay assumes +routing and +search are also in COMPOSE_FILE: the API,
# GraphHopper and Photon are then all in this compose project and on `edge`, so
# nginx addresses them as `api:7500`, `graphhopper:8989`, `photon:2322` — no IP
# to keep in sync. PHOTON_UPSTREAM / GRAPHHOPPER_UPSTREAM are optional and only
# used for a deployment where GraphHopper or Photon runs outside this project
# (set them in docker/prod/.env and uncomment the matching lines in
# nginx/detour.conf.template).
services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # `edge` alone: the API, GraphHopper and Photon all join it precisely so one
    # reverse proxy can reach them without also reaching either database.
    networks:
      - edge
    ports:
      - 0.0.0.0:${PROXY_PORT:-8088}:80
    environment:
      PHOTON_UPSTREAM: ${PHOTON_UPSTREAM:-}
      GRAPHHOPPER_UPSTREAM: ${GRAPHHOPPER_UPSTREAM:-}
    volumes:
      - ./nginx/detour.conf.template:/etc/nginx/templates/detour.conf.template:ro
