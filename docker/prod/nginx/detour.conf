# Path-routes one hostname to the three services a rider can otherwise only
# reach as three separate addresses (Settings → Server → "Different address
# per service"). See CONTRIBUTING.md's "one-hostname layout".
#
# The API and Photon both answer under /api — that's the whole reason a
# split deployment exists at all (CONTRIBUTING.md says so explicitly). What
# makes one hostname possible here is that Photon answers *only* the exact
# path `/api/` (query params carry the search), while every API route is
# `/api/<something>`. nginx's `=` (exact) location always wins over a prefix
# one regardless of file order, so the two can't collide.
server {
    listen 80;
    server_name _;

    # Photon: exact "/api/" only (its query-string search endpoint).
    location = /api/ {
        proxy_pass http://192.168.0.207:2322/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The sync + social API: everything else under /api, including the
    # convoy live relay's WebSocket upgrade (Startup.cs enables it ahead of
    # auth, but the route itself is still one of this prefix's controllers).
    location /api/ {
        proxy_pass http://192.168.0.24:7500/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # GraphHopper.
    location /route {
        proxy_pass http://192.168.0.23:8989/route;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
