# GraphHopper routing, for local development only. Keep the graphhopper: block in
# sync with docker/prod/config/graphhopper/config.yml — only datareader.file
# differs, because dev reads a manually-downloaded extract.
#
# The profile NAMES here are load-bearing: the app sends them as the `profile`
# query parameter, from TravelMode.ghProfile in
# shared/src/commonMain/kotlin/com/jellemax/detour/data/TravelMode.kt. They are
# `car` and `moto`. Renaming either leaves every routing request 400ing, which
# surfaces in the app as a null route - a spin candidate showing
# "~ straight-line" distance, and no in-app navigation - rather than as an
# error you can see.

graphhopper:
  # Manually downloaded; see services/graphhopper.yml for the curl. Prod points
  # this at /osm/region.osm.pbf, which its osm-extract init container writes.
  datareader.file: /osm/belgium-latest.osm.pbf
  graph.location: /graph

  # Where moto.json is mounted by services/graphhopper.yml. Built-in models
  # (car.json below) come from inside the jar and need no file here — in fact a
  # file in this directory named after one of them is a hard startup error:
  # "Custom model file name 'car.json' is already used for built-in profiles".
  custom_models.directory: /config

  # These carry no car traffic, and importing them costs graph size and build
  # time for edges no profile here can use.
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps

  # Everything the two models below read (car_access, car_average_speed from the
  # built-in car.json; road_class, surface, track_type from moto.json), plus
  # road_environment / road_access / max_speed, which cost little and are what
  # path details and any future model would want. From 9.x on a vehicle IS an
  # encoded value — `car_access` and `car_average_speed` did not exist in 8.x, and
  # there is no `vehicle:` profile key any more.
  #
  # toll, surface and road_environment are also what the app's request-time
  # avoid rules (tolls, unpaved, ferries) read. The app asks /info whether the
  # graph has them (RoutingSupport) before sending such a rule, because a rule
  # naming a value this graph lacks is an HTTP 400 (#586).
  # Changing this list means rebuilding the graph — see docker/prod/README.md,
  # "Rebuilding the routing graph".
  graph.encoded_values: >-
    road_class, road_environment, road_access, surface, track_type, toll,
    max_speed, car_access, car_average_speed

  profiles:
    # car.json is GraphHopper's own, from inside the jar. Nothing in this repo
    # overrides it — plain car routing should be whatever upstream ships.
    - name: car
      custom_model_files: [car.json]
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]

    # Two files, merged in order: that same built-in car model, then the moto
    # deltas. This is how a custom model inherits in GraphHopper 11 — there is no
    # `"base"` key. See moto.json.
    - name: moto
      custom_model_files: [car.json, moto.json]
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]

  # Speed mode. Each profile listed here gets its own contraction-hierarchy
  # prepared at build time, which is the slow part of a cold start and the
  # reason the graph cache is a named volume rather than a tmpfs.
  profiles_ch:
    - profile: car
    - profile: moto

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0

logging:
  appenders:
    - type: console
      time_zone: ${TZ:-Europe/Brussels}
      threshold: INFO
