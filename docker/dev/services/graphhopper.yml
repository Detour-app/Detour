name: ${PROJECT_NAME:-detour-dev}

services:
  # ---------------------------------------------------------------------------
  # GraphHopper — routing, for local development.
  #
  # This service exists so a developer can exercise the features that need a route
  # at all — in-app turn-by-turn, and the routed (rather than straight-line)
  # distance and ETA on spin candidates. Without a router those paths cannot run:
  # RoutingClient has no public fallback the way Geocoder does, so `route` comes
  # back null and navigation never starts.
  #
  # Routing IS packaged for production now, in docker/prod/docker-compose.routing.yml
  # — same image, same version, same config. Keep the two in sync; the only
  # intended difference is where the OSM extract comes from.
  #
  # The image is israelhikingmap's rather than an official one — GraphHopper
  # publishes no image to Docker Hub. It tracks the current major (#259 moved this
  # off 8.0, whose `vehicle: car` profile syntax 9.x replaced with
  # `custom_model_files`); bump it and config.yml together.
  #
  # The OSM extract is NOT in git — 662 MB of Belgium. Fetch it once:
  #
  #   curl -L -o docker/dev/data/graphhopper/belgium-latest.osm.pbf \
  #     https://download.geofabrik.de/europe/belgium-latest.osm.pbf
  #
  # Swap regions by putting a different .pbf there and pointing config.yml's
  # datareader.file at it. Routing only answers inside the extract's bounds; a
  # request outside them returns "Cannot find point", which reads in the app
  # exactly like a routing outage.
  #
  # First start builds the graph and the contraction hierarchies for both
  # profiles: minutes, and several GB of heap. That lands in the named volume,
  # so later starts are seconds. Deleting the volume pays for it again — and so
  # does changing the extract or the profile set, since the cache is keyed to
  # both. A GraphHopper major bump does too, and does not fail gracefully: a graph
  # built by 8.x will not load on 11. Drop it first:
  #
  #   docker compose -f docker/dev/docker-compose.yml down graphhopper
  #   docker volume rm detour-dev_graphhopper-data
  # ---------------------------------------------------------------------------
  graphhopper:
    image: israelhikingmap/graphhopper:11.0
    restart: unless-stopped
    networks:
      - detour-int
    ports:
      - 127.0.0.1:7510:8989
    volumes:
      # Read-only: a graph rebuild must not be able to corrupt the download.
      - ../data/graphhopper:/osm:ro
      - graphhopper-data:/graph
      - ../config/graphhopper/config.yml:/config.yml:ro
      # custom_models.directory in config.yml. Only moto.json — the `car` profile
      # uses GraphHopper's built-in car.json from inside the jar, and mounting a
      # file of that name here is a hard startup error. See moto.json.
      - ../config/graphhopper/moto.json:/config/moto.json:ro
    environment:
      # Read by the image's graphhopper.sh.
      JAVA_OPTS: -Xmx6g -Xms1g
      TZ: ${TZ:-Europe/Brussels}
    # The image's default entrypoint runs its own config-example.yml. Point its
    # own helper script at ours instead — the helper finds the jar itself, so
    # there is no version-stamped jar name to keep updating here. `-o` is not
    # optional: it defaults to /data/default-gh and is passed as
    # -Ddw.graphhopper.graph.location, which overrides config.yml.
    #
    # The 8.0 image needed -XX:-UseContainerSupport, because its JDK read cgroup
    # v1 layouts and NPEd out of CgroupV2Subsystem.getInstance on a cgroup v2
    # host. The 11.0 image is on JDK 21 and starts clean without it.
    entrypoint: ["./graphhopper.sh", "-c", "/config.yml", "-o", "/graph"]
    healthcheck:
      # /health reports up only once the graph is loaded, so this stays
      # unhealthy through the whole first build rather than flapping. The long
      # start_period is that build.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20m

networks:
  detour-int:

volumes:
  graphhopper-data:
