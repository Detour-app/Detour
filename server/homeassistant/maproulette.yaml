# Map Roulette → Home Assistant
#
# Lifetime totals, badges and the recent rides list, from the sync server's
# read-only /ha/* endpoints. See README.md in this folder for install steps.
#
# Needs three entries in secrets.yaml (the REST platform takes a URL, not a
# base + path, so the two endpoints are spelled out):
#   maproulette_stats_url: https://your-sync-server.example/ha/stats
#   maproulette_rides_url: https://your-sync-server.example/ha/rides
#   maproulette_key: <the key printed by sync_server.py --api-key>
# Plus, if the server is behind Cloudflare Access:
#   maproulette_cf_id: <service token client id>
#   maproulette_cf_secret: <service token client secret>

rest:
  # ---------------------------------------------------------------- totals --
  - resource: !secret maproulette_stats_url
    headers:
      X-API-Key: !secret maproulette_key
      # Only needed when the sync server sits behind Cloudflare Access.
      # Drop these two lines if it doesn't.
      CF-Access-Client-Id: !secret maproulette_cf_id
      CF-Access-Client-Secret: !secret maproulette_cf_secret
    scan_interval: 300
    sensor:
      - name: Map Roulette total distance
        unique_id: maproulette_total_distance
        value_template: "{{ (value_json.stats.totalDistanceMeters | float(0) / 1000) | round(1) }}"
        unit_of_measurement: km
        device_class: distance
        state_class: total_increasing
        icon: mdi:road-variant

      - name: Map Roulette rides
        unique_id: maproulette_ride_count
        value_template: "{{ value_json.rideCount | int(0) }}"
        unit_of_measurement: rides
        state_class: total_increasing
        icon: mdi:map-marker-path

      - name: Map Roulette badges
        unique_id: maproulette_badge_count
        value_template: "{{ value_json.badgeCount | int(0) }}"
        unit_of_measurement: badges
        icon: mdi:trophy-outline
        json_attributes:
          - badges

      - name: Map Roulette top speed
        unique_id: maproulette_top_speed
        value_template: "{{ value_json.stats.topSpeedKmh | float(0) | round(1) }}"
        unit_of_measurement: km/h
        device_class: speed
        icon: mdi:speedometer

      - name: Map Roulette longest ride
        unique_id: maproulette_longest_ride
        value_template: "{{ (value_json.stats.longestTripMeters | float(0) / 1000) | round(1) }}"
        unit_of_measurement: km
        device_class: distance
        icon: mdi:arrow-expand-horizontal

      - name: Map Roulette max lean
        unique_id: maproulette_max_lean
        # Null on a profile that has never recorded lean. Go unavailable
        # rather than report a 0° that reads as "never leaned".
        availability: "{{ value_json.stats.maxLeanDeg is not none }}"
        value_template: "{{ value_json.stats.maxLeanDeg | float(0) | round(1) }}"
        unit_of_measurement: °
        icon: mdi:motorbike

      - name: Map Roulette municipalities
        unique_id: maproulette_municipalities
        value_template: "{{ value_json.stats.municipalitiesVisited | int(0) }}"
        unit_of_measurement: places
        icon: mdi:city-variant-outline

      - name: Map Roulette best coverage
        unique_id: maproulette_best_coverage
        value_template: "{{ value_json.stats.bestCoveragePercent | float(0) | round(1) }}"
        unit_of_measurement: "%"
        icon: mdi:map-check-outline

  # ------------------------------------------------------------ last rides --
  - resource: !secret maproulette_rides_url
    headers:
      X-API-Key: !secret maproulette_key
      # Only needed when the sync server sits behind Cloudflare Access.
      # Drop these two lines if it doesn't.
      CF-Access-Client-Id: !secret maproulette_cf_id
      CF-Access-Client-Secret: !secret maproulette_cf_secret
    params:
      limit: "25"
    scan_interval: 300
    sensor:
      - name: Map Roulette last ride
        unique_id: maproulette_last_ride
        # State is when the ride started; everything else rides along as
        # attributes, so one entity feeds a whole card.
        value_template: >-
          {% set rides = value_json.rides %}
          {{ (rides[0].startMs / 1000) | as_datetime | isoformat if rides else none }}
        device_class: timestamp
        json_attributes_path: "$.rides[0]"
        json_attributes:
          - startMs
          - endMs
          - mode
          - distanceKm
          - topSpeedKmh
          - maxLeanDeg
          - maxGForce
          - pointCount
          - map

      - name: Map Roulette last ride distance
        unique_id: maproulette_last_ride_distance
        value_template: "{{ value_json.rides[0].distanceKm | float(0) if value_json.rides else 0 }}"
        unit_of_measurement: km
        device_class: distance
        icon: mdi:map-marker-distance

      - name: Map Roulette last ride top speed
        unique_id: maproulette_last_ride_top_speed
        value_template: "{{ value_json.rides[0].topSpeedKmh | float(0) if value_json.rides else 0 }}"
        unit_of_measurement: km/h
        device_class: speed
        icon: mdi:speedometer

      - name: Map Roulette last ride vehicle
        unique_id: maproulette_last_ride_mode
        value_template: >-
          {% set rides = value_json.rides %}
          {{ (rides[0].mode | default('unknown') | title) if rides else 'unknown' }}
        icon: mdi:car-select

      # The whole page of rides, for a table/markdown card.
      - name: Map Roulette recent rides
        unique_id: maproulette_recent_rides
        value_template: "{{ value_json.rides | count }}"
        unit_of_measurement: rides
        icon: mdi:format-list-bulleted
        json_attributes:
          - rides

template:
  - sensor:
      - name: Map Roulette last ride duration
        unique_id: maproulette_last_ride_duration
        unit_of_measurement: min
        device_class: duration
        icon: mdi:timer-outline
        state: >-
          {% set r = state_attr('sensor.map_roulette_last_ride', 'endMs') %}
          {% set s = state_attr('sensor.map_roulette_last_ride', 'startMs') %}
          {{ (((r | float(0)) - (s | float(0))) / 60000) | round(0) if r and s else 0 }}

      - name: Map Roulette last ride average speed
        unique_id: maproulette_last_ride_avg_speed
        unit_of_measurement: km/h
        device_class: speed
        icon: mdi:gauge
        state: >-
          {% set km = states('sensor.map_roulette_last_ride_distance') | float(0) %}
          {% set mins = states('sensor.map_roulette_last_ride_duration') | float(0) %}
          {{ (km / (mins / 60)) | round(1) if mins > 0 else 0 }}
